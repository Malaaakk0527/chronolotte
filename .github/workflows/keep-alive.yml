name: Keep Alive Chronolette

on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping boutique (garde Supabase actif)
        run: |
          curl -sS -o /dev/null -w "Home: %{http_code}\n" https://chronolotte.wasmer.app/
          curl -sS -o /dev/null -w "Up: %{http_code}\n" https://chronolotte.wasmer.app/up
          curl -sS -o /dev/null -w "Admin: %{http_code}\n" https://chronolotte.wasmer.app/admin/login
